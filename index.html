<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>역근무현황</title>

  <!-- iOS / 홈 화면 아이콘 & 메타데이터 -->
  <link rel="apple-touch-icon" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="shortcut icon" href="https://i.ibb.co/zWmkwfRw/image.png">
  <meta property="og:title" content="역근무현황">
  <meta property="og:description" content="부산-김해경전철 역무 지원 포털">
  <meta property="og:image" content="https://i.ibb.co/zWmkwfRw/image.png">
  <meta name="apple-mobile-web-app-title" content="역근무현황">

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #ffffff;
    }
    iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
  </style>
</head>
<body>
  <iframe id="appFrame" allow="clipboard-read; clipboard-write; clipboard-write *; web-share"></iframe>

  <script>
    const BASE_URL = "https://script.google.com/macros/s/AKfycbx0aNwrGPIT5fb4CJnl2J6I2dZvYHdWVJ7H9NHPX3w15A0fC_h68DcclLMwzYswn2nJ/exec";
    const appFrame = document.getElementById('appFrame');

    // 1. GitHub 최상위 저장소에서 저장된 값 읽기
    const savedTeam = localStorage.getItem('selected_team') || '';
    const savedName = localStorage.getItem('selected_name') || '';

    let params = [];
    if (savedTeam) params.push("team=" + encodeURIComponent(savedTeam));
    if (savedName) params.push("name=" + encodeURIComponent(savedName));

    // 파라미터를 달아서 iframe 호출
    appFrame.src = params.length > 0 ? (BASE_URL + "?" + params.join("&")) : BASE_URL;

    // 2. 내부 앱에서 postMessage가 오면 즉시 로컬스토리지에 저장
    window.addEventListener("message", function(e) {
      if (!e.data) return;

      if (e.data.type === "SAVE_USER_PREF") {
        if (e.data.key && e.data.value !== undefined) {
          localStorage.setItem(e.data.key, e.data.value);
        }
      }
    });
  </script>
</body>
</html>
