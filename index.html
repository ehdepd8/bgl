<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>역근무현황</title>
  <link rel="apple-touch-icon" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="shortcut icon" href="https://i.ibb.co/zWmkwfRw/image.png">
  <meta property="og:title" content="역근무현황">
  <meta property="og:description" content="부산-김해경전철 역무 지원 포털">
  <meta property="og:image" content="https://i.ibb.co/zWmkwfRw/image.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbx0aNwrGPIT5fb4CJnl2J6I2dZvYHdWVJ7H9NHPX3w15A0fC_h68DcclLMwzYswn2nJ/exec" allow="clipboard-read; clipboard-write; clipboard-write *; web-share"></iframe>

  <script>
    // 복잡한 URL 조작이나 강제 덮어쓰기 없이, 오직 요청이 올 때만 로컬스토리지 백업 지원
    const appFrame = document.getElementById('appFrame');

    window.addEventListener("message", function(e) {
      if (!e.data) return;

      // 자식이 유효한 이름/팀을 보낼 때만 안전하게 백업 (빈칸은 절대 덮어쓰지 않음!)
      if (e.data.type === "SAVE_USER_PREF") {
        if (e.data.team) localStorage.setItem('station_user_team', String(e.data.team));
        if (e.data.name && String(e.data.name).trim() !== '') {
          localStorage.setItem('station_user_name', String(e.data.name).trim());
        }
      }

      // 자식이 요청할 때만 내려보냄
      if (e.data.type === "REQUEST_USER_PREF") {
        const savedTeam = localStorage.getItem('station_user_team') || '3';
        const savedName = localStorage.getItem('station_user_name') || '';
        if (savedName && appFrame && appFrame.contentWindow) {
          appFrame.contentWindow.postMessage({
            type: "RESTORE_PREF",
            team: savedTeam,
            name: savedName
          }, "*");
        }
      }
    }, false);
  </script>
</body>
</html>
