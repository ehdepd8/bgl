<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>역근무현황</title>
  <link rel="apple-touch-icon" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="shortcut icon" href="https://i.ibb.co/zWmkwfRw/image.png">
  <meta property="og:title" content="역근무현황">
  <meta property="og:description" content="부산-김해경전철 역무 지원 포털">
  <meta property="og:image" content="https://i.ibb.co/zWmkwfRw/image.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="appFrame" allow="clipboard-read; clipboard-write; clipboard-write *; web-share"></iframe>

  <script>
    const BASE_APP_URL = "https://script.google.com/macros/s/AKfycbx0aNwrGPIT5fb4CJnl2J6I2dZvYHdWVJ7H9NHPX3w15A0fC_h68DcclLMwzYswn2nJ/exec";
    const appFrame = document.getElementById('appFrame');

    // 1. 초기 URL 파라미터 전달 (주소창 파라미터가 있으면 우선 보존)
    const currentQuery = window.location.search || "";
    const currentHash = window.location.hash || "";
    
    // 아이폰 근무표 복원을 위한 저장된 팀/이름 파라미터 보강
    let initialUrl = BASE_APP_URL + currentQuery + currentHash;
    const ua = navigator.userAgent || navigator.vendor || window.opera;
    const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    if (isIOS && !currentQuery.includes("initName")) {
      try {
        const savedDutyTeam = localStorage.getItem('recent_station_team') || '3';
        const savedDutyName = localStorage.getItem('recent_station_name') || '';
        if (savedDutyName) {
          const sep = initialUrl.includes('?') ? '&' : '?';
          initialUrl += `${sep}initTeam=${encodeURIComponent(savedDutyTeam)}&initName=${encodeURIComponent(savedDutyName)}`;
        }
      } catch(e) {}
    }
    appFrame.src = initialUrl;

    // 2. iframe(시각표 및 근무표)과의 메시지 통신 브릿지
    window.addEventListener("message", function(e) {
      if (!e || !e.data) return;

      // [A] 시각표 저장 요청 수신 (TimetableView -> 부모 스토리지)
      if (e.data.type === "SAVE_TIMETABLE_PREF") {
        try {
          if (e.data.station) {
            localStorage.setItem('lastTimetableStation', e.data.station);
          }
          if (e.data.records !== undefined) {
            localStorage.setItem('timetable_picked_records_v1', JSON.stringify(e.data.records));
          }
        } catch(err) {}
      }

      // [B] 시각표 데이터 요청 수신 (TimetableView 켜질 때 -> 부모가 저장된 값 응답)
      if (e.data.type === "REQ_TIMETABLE_PREF") {
        try {
          const st = localStorage.getItem('lastTimetableStation') || "대저역";
          const rawRec = localStorage.getItem('timetable_picked_records_v1');
          const records = rawRec ? JSON.parse(rawRec) : {};

          if (appFrame && appFrame.contentWindow) {
            appFrame.contentWindow.postMessage({
              type: "SEND_TIMETABLE_PREF",
              station: st,
              records: records
            }, "*");
          }
        } catch(err) {}
      }

      // [C] 근무표 팀/이름 저장 요청 수신 (DutyView -> 부모 스토리지)
      if (e.data.type === "SET_RECENT_DUTY_USER" || e.data.type === "SAVE_USER_PREF") {
        try {
          const team = e.data.team || '3';
          const name = (e.data.name || '').trim();
          if (name) {
            localStorage.setItem('recent_station_team', team);
            localStorage.setItem('recent_station_name', name);
            localStorage.setItem('station_duty_team', team);
            localStorage.setItem('station_duty_name', name);
          }
        } catch(err) {}
      }
    }, false);
  </script>
</body>
</html>
