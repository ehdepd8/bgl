<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>역근무현황</title>

  <link rel="apple-touch-icon" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="shortcut icon" href="https://i.ibb.co/zWmkwfRw/image.png">
  <meta property="og:title" content="역근무현황">
  <meta property="og:description" content="부산-김해경전철 역무 지원 포털">
  <meta property="og:image" content="https://i.ibb.co/zWmkwfRw/image.png">

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #ffffff;
    }
    iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
  </style>
</head>
<body>
  <iframe id="appFrame" allow="clipboard-read; clipboard-write; clipboard-write *; web-share"></iframe>

  <script>
    const BASE_URL = "https://script.google.com/macros/s/AKfycbx0aNwrGPIT5fb4CJnl2J6I2dZvYHdWVJ7H9NHPX3w15A0fC_h68DcclLMwzYswn2nJ/exec";
    const appFrame = document.getElementById('appFrame');

    // 1. [핵심] 로컬스토리지 우선 탐색
    let currentTeam = localStorage.getItem('station_user_team') || '';
    let currentName = localStorage.getItem('station_user_name') || '';
    let currentStation = localStorage.getItem('lastTimetableStation') || '';
    let currentTtRecords = localStorage.getItem('timetable_picked_records_v1') || '';

    // 2. [오염 방지] 주소창 쿼리는 로컬스토리지에 값이 아예 없을 때만 보조로 사용
    const urlParams = new URLSearchParams(window.location.search);
    if (!currentTeam && urlParams.get('initTeam')) {
      currentTeam = urlParams.get('initTeam');
      localStorage.setItem('station_user_team', currentTeam);
    }
    if (!currentName && urlParams.get('initName')) {
      currentName = urlParams.get('initName');
      localStorage.setItem('station_user_name', currentName);
    }
    if (!currentStation && urlParams.get('initStation')) {
      currentStation = urlParams.get('initStation');
    }
    if (!currentTtRecords && urlParams.get('initTtRecords')) {
      currentTtRecords = urlParams.get('initTtRecords');
    }

    if (!currentTeam) currentTeam = '3';

    // 3. [사파리 롤백 방지] 과거 쿼리 스트링이 사파리 세션에 박히지 않도록 순수 URL로 즉시 정리
    if (window.location.search) {
      try {
        const cleanUrl = window.location.origin + window.location.pathname;
        window.history.replaceState({}, '', cleanUrl);
      } catch (e) {}
    }

    // 4. Apps Script iframe URL 생성
    function buildIframeUrl() {
      let queryParts = [];
      if (currentTeam) queryParts.push("initTeam=" + encodeURIComponent(currentTeam));
      if (currentName) queryParts.push("initName=" + encodeURIComponent(currentName));
      if (currentStation) queryParts.push("initStation=" + encodeURIComponent(currentStation));
      if (currentTtRecords) queryParts.push("initTtRecords=" + encodeURIComponent(currentTtRecords));
      return queryParts.length > 0 ? (BASE_URL + "?" + queryParts.join("&")) : BASE_URL;
    }

    appFrame.src = buildIframeUrl();

    // 5. iframe으로 최신 확정값 푸시
    function pushToIframe() {
      if (appFrame && appFrame.contentWindow) {
        appFrame.contentWindow.postMessage({
          type: "RESTORE_PREF",
          team: currentTeam,
          name: currentName
        }, "*");
      }
    }

    appFrame.addEventListener('load', function() {
      pushToIframe();
      setTimeout(pushToIframe, 300);
      setTimeout(pushToIframe, 800);
    });

    // 6. 변경 메시지 수신 시 처리
    window.addEventListener("message", function(e) {
      if (!e.data) return;

      if (e.data.type === "SAVE_USER_PREF") {
        if (e.data.team) {
          currentTeam = String(e.data.team);
          localStorage.setItem('station_user_team', currentTeam);
        }
        if (e.data.name !== undefined) {
          currentName = String(e.data.name).trim();
          localStorage.setItem('station_user_name', currentName);
        }
      }

      if (e.data.type === "SAVE_TIMETABLE_PREF") {
        if (e.data.station) {
          currentStation = String(e.data.station);
          localStorage.setItem('lastTimetableStation', currentStation);
        }
        if (e.data.records !== undefined) {
          localStorage.setItem('timetable_picked_records_v1', JSON.stringify(e.data.records));
        }
      }

      if (e.data.type === "REQUEST_USER_PREF") {
        pushToIframe();
      }
    }, false);
  </script>
</body>
</html>
