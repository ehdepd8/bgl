<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>역근무현황</title>
  <link rel="apple-touch-icon" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="shortcut icon" href="https://i.ibb.co/zWmkwfRw/image.png">
  <meta property="og:title" content="역근무현황">
  <meta property="og:description" content="부산-김해경전철 역무 지원 포털">
  <meta property="og:image" content="https://i.ibb.co/zWmkwfRw/image.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="appFrame" allow="clipboard-read; clipboard-write; clipboard-write *; web-share"></iframe>

  <script>
    const BASE_APP_URL = "https://script.google.com/macros/s/AKfycbx0aNwrGPIT5fb4CJnl2J6I2dZvYHdWVJ7H9NHPX3w15A0fC_h68DcclLMwzYswn2nJ/exec";
    const appFrame = document.getElementById('appFrame');

    // 1. 현재 접속된 GitHub URL 쿼리 파라미터 우선 확인 (?initTeam=...&initName=...)
    const urlParams = new URLSearchParams(window.location.search);
    let currentTeam = urlParams.get('initTeam') || '';
    let currentName = urlParams.get('initName') || '';

    // 2. 주소창에 파라미터가 없다면 GitHub 자체 1st-party localStorage에서 복원
    if (!currentName) {
      try {
        currentName = localStorage.getItem('station_user_name') || '';
        currentTeam = localStorage.getItem('station_user_team') || '';
      } catch(e) {}
    }

    // 3. ★ 핵심: 저장된 정보가 있으면 iframe src에 쿼리를 붙여서 띄움 (빈칸 로딩 원천 차단)
    let finalSrc = BASE_APP_URL;
    if (currentName) {
      finalSrc += "?initTeam=" + encodeURIComponent(currentTeam || '3') + "&initName=" + encodeURIComponent(currentName);
    }
    appFrame.src = finalSrc;

    // 4. 자식 화면에서 팀이나 이름을 바꿀 때마다 GitHub 1st-party 스토리지에 영구 보관
    window.addEventListener("message", function(e) {
      if (!e || !e.data) return;

      if (e.data.type === "SAVE_USER_PREF") {
        const newTeam = e.data.team || '3';
        const newName = (e.data.name || '').trim();

        if (newName) {
          try {
            localStorage.setItem('station_user_team', newTeam);
            localStorage.setItem('station_user_name', newName);
          } catch(err) {}
        }
      }
    }, false);
  </script>
</body>
</html>
