<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>역근무현황</title>

  <link rel="apple-touch-icon" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="shortcut icon" href="https://i.ibb.co/zWmkwfRw/image.png">
  <meta property="og:title" content="역근무현황">
  <meta property="og:description" content="부산-김해경전철 역무 지원 포털">
  <meta property="og:image" content="https://i.ibb.co/zWmkwfRw/image.png">

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #ffffff;
    }
    iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
  </style>
</head>
<body>
  <iframe id="appFrame" allow="clipboard-read; clipboard-write; clipboard-write *; web-share"></iframe>

  <script>
    const BASE_URL = "https://script.google.com/macros/s/AKfycbx0aNwrGPIT5fb4CJnl2J6I2dZvYHdWVJ7H9NHPX3w15A0fC_h68DcclLMwzYswn2nJ/exec";
    const appFrame = document.getElementById('appFrame');

    // 1. 현재 브라우저 주소창 파라미터 또는 GitHub 저장소 값 확인
    const urlParams = new URLSearchParams(window.location.search);
    let team = urlParams.get('initTeam') || localStorage.getItem('station_user_team') || '';
    let name = urlParams.get('initName') || localStorage.getItem('station_user_name') || '';

    let queryParts = [];
    if (team) queryParts.push("initTeam=" + encodeURIComponent(team));
    if (name) queryParts.push("initName=" + encodeURIComponent(name));

    const finalUrl = queryParts.length > 0 ? (BASE_URL + "?" + queryParts.join("&")) : BASE_URL;
    appFrame.src = finalUrl;

    // 2. 내부 웹앱(iframe)과 양방향 통신 처리
    window.addEventListener("message", function(e) {
      if (!e.data) return;

      // [A] 팀 / 이름 저장
      if (e.data.type === "SAVE_USER_PREF") {
        if (e.data.team) localStorage.setItem('station_user_team', String(e.data.team));
        if (e.data.name) localStorage.setItem('station_user_name', String(e.data.name));
      }

      // [B] 시각표 데이터(역 선택, 선택한 분 기록) 저장
      if (e.data.type === "SAVE_TIMETABLE_PREF") {
        if (e.data.station) localStorage.setItem('lastTimetableStation', String(e.data.station));
        if (e.data.records !== undefined) localStorage.setItem('timetable_picked_records_v1', JSON.stringify(e.data.records));
      }

      // [C] 시각표 화면에서 데이터 요청 시 전달 (아이폰 Safari ITP 우회 복원)
      if (e.data.type === "REQ_TIMETABLE_PREF") {
        const savedStation = localStorage.getItem('lastTimetableStation') || '';
        let savedRecords = null;
        try {
          const raw = localStorage.getItem('timetable_picked_records_v1');
          if (raw) savedRecords = JSON.parse(raw);
        } catch(err) {}

        if (e.source) {
          e.source.postMessage({
            type: "SEND_TIMETABLE_PREF",
            station: savedStation,
            records: savedRecords
          }, "*");
        }
      }
    }, false);
  </script>
</body>
</html>
