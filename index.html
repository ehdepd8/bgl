<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>역근무현황</title>

  <!-- 홈 화면 아이콘 & 메타데이터 -->
  <link rel="apple-touch-icon" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="shortcut icon" href="https://i.ibb.co/zWmkwfRw/image.png">
  <meta property="og:title" content="역근무현황">
  <meta property="og:description" content="부산-김해경전철 역무 지원 포털">
  <meta property="og:image" content="https://i.ibb.co/zWmkwfRw/image.png">

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #ffffff;
    }
    iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
  </style>
</head>
<body>
  <!-- 클립보드 및 웹 공유 권한 포함, 깔끔한 원본 URL 로드 -->
  <iframe id="appFrame" 
          src="https://script.google.com/macros/s/AKfycbx0aNwrGPIT5fb4CJnl2J6I2dZvYHdWVJ7H9NHPX3w15A0fC_h68DcclLMwzYswn2nJ/exec" 
          allow="clipboard-read; clipboard-write; clipboard-write *; web-share">
  </iframe>

  <script>
    const appFrame = document.getElementById('appFrame');

    window.addEventListener("message", function(e) {
      if (!e.data) return;

      // 1. 내부 웹앱이 로드되어 "저장된 데이터 달라"고 요청할 때
      if (e.data.type === "REQ_INIT_USER") {
        const team = localStorage.getItem('station_team') || '';
        const name = localStorage.getItem('station_name') || '';

        // 안쪽 iframe으로 보관된 데이터 전달
        appFrame.contentWindow.postMessage({
          type: "SEND_INIT_USER",
          team: team,
          name: name
        }, "*");
      }

      // 2. 내부 웹앱에서 팀/이름이 변경되어 저장 요청할 때
      if (e.data.type === "SAVE_USER_PREF") {
        if (e.data.team !== undefined) localStorage.setItem('station_team', e.data.team);
        if (e.data.name !== undefined) localStorage.setItem('station_name', e.data.name);
      }
    });
  </script>
</body>
</html>
