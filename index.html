<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>역근무현황</title>
  <link rel="apple-touch-icon" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="shortcut icon" href="https://i.ibb.co/zWmkwfRw/image.png">
  <meta property="og:title" content="역근무현황">
  <meta property="og:description" content="부산-김해경전철 역무 지원 포털">
  <meta property="og:image" content="https://i.ibb.co/zWmkwfRw/image.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="appFrame" allow="clipboard-read; clipboard-write; clipboard-write *; web-share"></iframe>

  <script>
    const BASE_APP_URL = "https://script.google.com/macros/s/AKfycbx0aNwrGPIT5fb4CJnl2J6I2dZvYHdWVJ7H9NHPX3w15A0fC_h68DcclLMwzYswn2nJ/exec";
    const appFrame = document.getElementById('appFrame');

    // 1. 부모 창(GitHub 도메인 자체)의 로컬스토리지 확인 (아이폰 사파리도 100% 영구 보존)
    let savedTeam = '';
    let savedName = '';
    try {
      savedTeam = localStorage.getItem('station_user_team') || '';
      savedName = localStorage.getItem('station_user_name') || '';
    } catch(e) {}

    // 2. 외부 주소창은 순수 주소 그대로 두고, iframe 내부 src에만 파라미터를 결합하여 실행
    let finalSrc = BASE_APP_URL;
    if (savedName) {
      finalSrc += "?initTeam=" + encodeURIComponent(savedTeam || '3') + "&initName=" + encodeURIComponent(savedName);
    }
    appFrame.src = finalSrc;

    // 3. 자식 화면(DutyView)에서 이름을 입력하거나 변경하면 부모 스토리지에 영구 보관
    window.addEventListener("message", function(e) {
      if (!e || !e.data) return;

      if (e.data.type === "SAVE_USER_PREF") {
        const newTeam = e.data.team || '3';
        const newName = (e.data.name || '').trim();

        // ★ 빈칸으로 들어오는 잘못된 요청은 절대 기존 저장값을 덮어쓰지 않음
        if (newName) {
          try {
            localStorage.setItem('station_user_team', newTeam);
            localStorage.setItem('station_user_name', newName);
          } catch(err) {}
        }
      }
    }, false);
  </script>
</body>
</html>
