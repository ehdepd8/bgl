<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>역근무현황</title>

  <link rel="apple-touch-icon" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="shortcut icon" href="https://i.ibb.co/zWmkwfRw/image.png">
  <meta property="og:title" content="역근무현황">
  <meta property="og:description" content="부산-김해경전철 역무 지원 포털">
  <meta property="og:image" content="https://i.ibb.co/zWmkwfRw/image.png">

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #ffffff;
    }
    iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
  </style>
</head>
<body>
  <iframe id="appFrame" allow="clipboard-read; clipboard-write; clipboard-write *; web-share"></iframe>

  <script>
    const BASE_URL = "https://script.google.com/macros/s/AKfycbx0aNwrGPIT5fb4CJnl2J6I2dZvYHdWVJ7H9NHPX3w15A0fC_h68DcclLMwzYswn2nJ/exec";
    const appFrame = document.getElementById('appFrame');

    // 1. GitHub 최상위 저장소에서 저장된 값 읽기
    const savedTeam = localStorage.getItem('station_user_team') || '';
    const savedName = localStorage.getItem('station_user_name') || '';

    // 2. URL 파라미터로 실어서 iframe 호출 (Safari 스토리지 격리 완전 우회)
    let params = [];
    if (savedTeam) params.push("initTeam=" + encodeURIComponent(savedTeam));
    if (savedName) params.push("initName=" + encodeURIComponent(savedName));

    appFrame.src = params.length > 0 ? (BASE_URL + "?" + params.join("&")) : BASE_URL;

    // 3. 내부 웹앱에서 팀/이름이 변경되면 GitHub 로컬스토리지에 즉시 영구 보관
    window.addEventListener("message", function(e) {
      if (!e.data || e.data.type !== "SAVE_USER_PREF") return;

      if (e.data.team !== undefined && e.data.team !== null && e.data.team !== '') {
        localStorage.setItem('station_user_team', String(e.data.team));
      }
      if (e.data.name !== undefined && e.data.name !== null && e.data.name !== '') {
        localStorage.setItem('station_user_name', String(e.data.name));
      }
    });
  </script>
</body>
</html>
