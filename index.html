<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>역근무현황</title>
  <link rel="apple-touch-icon" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="shortcut icon" href="https://i.ibb.co/zWmkwfRw/image.png">
  <meta property="og:title" content="역근무현황">
  <meta property="og:description" content="부산-김해경전철 역무 지원 포털">
  <meta property="og:image" content="https://i.ibb.co/zWmkwfRw/image.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="https://script.google.com/macros/s/AKfycbx0aNwrGPIT5fb4CJnl2J6I2dZvYHdWVJ7H9NHPX3w15A0fC_h68DcclLMwzYswn2nJ/exec" allow="clipboard-read; clipboard-write; clipboard-write *; web-share"></iframe>

  <script>
    const appFrame = document.getElementById('appFrame');

    // 1. URL 해시 또는 부모 로컬스토리지에서 저장값 추출
    function getStoredPref() {
      let team = '';
      let name = '';

      // 해시(#team=2&name=홍길동) 우선 확인
      if (location.hash && location.hash.length > 1) {
        const params = new URLSearchParams(location.hash.substring(1));
        team = params.get('team') || '';
        name = params.get('name') || '';
      }

      // 없으면 부모의 1st-party localStorage 확인
      if (!team) {
        try { team = localStorage.getItem('station_user_team') || ''; } catch(e) {}
      }
      if (!name) {
        try { name = localStorage.getItem('station_user_name') || ''; } catch(e) {}
      }

      return { team: team || '3', name: name || '' };
    }

    // 2. 자식 iframe이 요청하거나 로드될 때 설정값 전달
    function sendPrefToChild() {
      const pref = getStoredPref();
      if (pref.name && appFrame && appFrame.contentWindow) {
        appFrame.contentWindow.postMessage({
          type: "RESTORE_PREF",
          team: pref.team,
          name: pref.name
        }, "*");
      }
    }

    // iframe 로딩 완료 시 전송
    appFrame.onload = function() {
      sendPrefToChild();
    };

    // 자식 메시지 처리
    window.addEventListener("message", function(e) {
      if (!e.data) return;

      // 자식이 값 저장을 요청한 경우
      if (e.data.type === "SAVE_USER_PREF") {
        const t = e.data.team || '3';
        const n = (e.data.name || '').trim();

        if (n) {
          // A. 1st-party localStorage에 저장
          try {
            localStorage.setItem('station_user_team', t);
            localStorage.setItem('station_user_name', n);
          } catch(err) {}

          // B. ★ 사파리 ITP를 뚫는 핵심: 브라우저 URL 해시에 새겨둠 (화면 새로고침 없이)
          try {
            const newHash = '#team=' + encodeURIComponent(t) + '&name=' + encodeURIComponent(n);
            history.replaceState(null, '', newHash);
          } catch(err) {}
        }
      }

      // 자식이 설정을 달라고 요청한 경우
      if (e.data.type === "REQUEST_USER_PREF") {
        sendPrefToChild();
      }
    }, false);
  </script>
</body>
</html>
