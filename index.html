<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>역근무현황</title>

  <link rel="apple-touch-icon" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="shortcut icon" href="https://i.ibb.co/zWmkwfRw/image.png">
  <meta property="og:title" content="역근무현황">
  <meta property="og:description" content="부산-김해경전철 역무 지원 포털">
  <meta property="og:image" content="https://i.ibb.co/zWmkwfRw/image.png">

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background-color: #ffffff;
    }
    iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
  </style>
</head>
<body>
  <iframe id="appFrame" allow="clipboard-read; clipboard-write; clipboard-write *; web-share"></iframe>

  <script>
    const BASE_URL = "https://script.google.com/macros/s/AKfycbx0aNwrGPIT5fb4CJnl2J6I2dZvYHdWVJ7H9NHPX3w15A0fC_h68DcclLMwzYswn2nJ/exec";
    const appFrame = document.getElementById('appFrame');

    // 1. 값 읽기 (URL 파라미터 -> 로컬스토리지 순)
    const urlParams = new URLSearchParams(window.location.search);
    let currentTeam = urlParams.get('initTeam') || localStorage.getItem('station_user_team') || '3';
    let currentName = urlParams.get('initName') || localStorage.getItem('station_user_name') || '';
    let currentStation = urlParams.get('initStation') || localStorage.getItem('lastTimetableStation') || '';
    let currentTtRecords = urlParams.get('initTtRecords') || localStorage.getItem('timetable_picked_records_v1') || '';

    // 2. Apps Script에 넘겨줄 URL 조립
    let queryParts = [];
    if (currentTeam) queryParts.push("initTeam=" + encodeURIComponent(currentTeam));
    if (currentName) queryParts.push("initName=" + encodeURIComponent(currentName));
    if (currentStation) queryParts.push("initStation=" + encodeURIComponent(currentStation));
    if (currentTtRecords) queryParts.push("initTtRecords=" + encodeURIComponent(currentTtRecords));

    appFrame.src = queryParts.length > 0 ? (BASE_URL + "?" + queryParts.join("&")) : BASE_URL;

    // 3. 내부 웹앱으로 복원 메시지 전송
    function pushToIframe() {
      if (appFrame && appFrame.contentWindow && (currentTeam || currentName)) {
        appFrame.contentWindow.postMessage({
          type: "RESTORE_PREF",
          team: currentTeam,
          name: currentName
        }, "*");
      }
    }

    appFrame.addEventListener('load', function() {
      pushToIframe();
      setTimeout(pushToIframe, 300);
      setTimeout(pushToIframe, 1000);
    });

    // 4. 내부 웹앱 변경사항 실시간 수신
    window.addEventListener("message", function(e) {
      if (!e.data) return;

      if (e.data.type === "SAVE_USER_PREF") {
        let changed = false;
        if (e.data.team) {
          currentTeam = String(e.data.team);
          localStorage.setItem('station_user_team', currentTeam);
          changed = true;
        }
        if (e.data.name) {
          currentName = String(e.data.name);
          localStorage.setItem('station_user_name', currentName);
          changed = true;
        }

        // 브라우저 주소창(URL) 실시간 갱신 (사파리 세션 종료 대비)
        if (changed) {
          try {
            const nextUrl = new URL(window.location.href);
            if (currentTeam) nextUrl.searchParams.set('initTeam', currentTeam);
            if (currentName) nextUrl.searchParams.set('initName', currentName);
            window.history.replaceState({}, '', nextUrl.toString());
          } catch(err) {}
        }
      }

      if (e.data.type === "SAVE_TIMETABLE_PREF") {
        if (e.data.station) {
          currentStation = String(e.data.station);
          localStorage.setItem('lastTimetableStation', currentStation);
        }
        if (e.data.records !== undefined) {
          localStorage.setItem('timetable_picked_records_v1', JSON.stringify(e.data.records));
        }
      }

      if (e.data.type === "REQUEST_USER_PREF") {
        pushToIframe();
      }
    }, false);
  </script>
</body>
</html>
