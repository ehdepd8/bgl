<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>역근무현황</title>
  <link rel="apple-touch-icon" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="icon" type="image/png" sizes="192x192" href="https://i.ibb.co/zWmkwfRw/image.png">
  <link rel="shortcut icon" href="https://i.ibb.co/zWmkwfRw/image.png">
  <meta property="og:title" content="역근무현황">
  <meta property="og:description" content="부산-김해경전철 역무 지원 포털">
  <meta property="og:image" content="https://i.ibb.co/zWmkwfRw/image.png">
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; }
    iframe { width: 100%; height: 100%; border: none; display: block; }

  /* 내부 헤더 텍스트와 높이 및 여백 완벽 일치 */
    #portalLogoutBtn {
      position: fixed;
      top: 21px;            /* 18px -> 21px로 살짝 내려 글자 중심선과 일치 */
      right: 24px;          /* 흰색 카드 우측 끝선 여백과 정렬 */
      z-index: 99999;
      display: none;        /* 초기 깜빡임 방지: 기본 숨김 */
      align-items: center;
      gap: 3px;
      font-size: 11px;
      font-weight: 700;
      color: #64748b;
      background-color: #f1f5f9;
      border: 1px solid #cbd5e1;
      padding: 3px 8px;
      border-radius: 6px;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      transition: all 0.2s;
    }
    #portalLogoutBtn:hover {
      color: #e11d48;
      border-color: #fca5a5;
      background-color: #fff1f2;
    }
  </style>
</head>
<body>
  <!-- 초기 로딩 시 깜빡임 방지 (style="display: none;") -->
  <button type="button" id="portalLogoutBtn" onclick="handlePortalLogout()" style="display: none;">
    <span>🔒</span> 로그아웃
  </button>

  <!-- 메인 iframe -->
  <iframe id="appFrame" allow="clipboard-read; clipboard-write; clipboard-write *; web-share"></iframe>

  <!-- 관제 스타일 PIN 인증 화면 -->
  <div id="portalPinScreen" style="display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #0b1120; z-index: 9999999; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; backdrop-filter: blur(10px);">
    <div style="background-color: #0f172a; border: 1px solid #1e293b; border-radius: 20px; width: 100%; max-width: 320px; padding: 28px 20px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8); display: flex; flex-direction: column; align-items: center; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      
      <!-- 관제 헤더 -->
      <div style="font-size: 11px; font-weight: 800; color: #38bdf8; letter-spacing: 2px; margin-bottom: 4px;">BGL OCC CONTROL</div>
      <div style="font-size: 16px; font-weight: 700; margin-bottom: 20px; color: #ffffff;">통합 포털 보안 인증</div>

      <!-- 4자리 PIN 인디케이터 (● ○ ○ ○) -->
      <div style="display: flex; gap: 14px; margin-bottom: 24px;">
        <span class="pin-dot" id="pDot0" style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid #475569; background: transparent; transition: all 0.2s;"></span>
        <span class="pin-dot" id="pDot1" style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid #475569; background: transparent; transition: all 0.2s;"></span>
        <span class="pin-dot" id="pDot2" style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid #475569; background: transparent; transition: all 0.2s;"></span>
        <span class="pin-dot" id="pDot3" style="width: 14px; height: 14px; border-radius: 50%; border: 2px solid #475569; background: transparent; transition: all 0.2s;"></span>
      </div>

      <!-- 상태 메시지 -->
      <div id="pStatusMsg" style="font-size: 11px; color: #94a3b8; height: 16px; margin-bottom: 14px; font-weight: 600;">4자리 보안 PIN을 입력하세요</div>

      <!-- 3x4 키패드 -->
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; width: 100%;">
        <button type="button" onclick="pressPortalPin('1')" style="height: 50px; font-size: 20px; font-weight: bold; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 12px; cursor: pointer;">1</button>
        <button type="button" onclick="pressPortalPin('2')" style="height: 50px; font-size: 20px; font-weight: bold; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 12px; cursor: pointer;">2</button>
        <button type="button" onclick="pressPortalPin('3')" style="height: 50px; font-size: 20px; font-weight: bold; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 12px; cursor: pointer;">3</button>
        <button type="button" onclick="pressPortalPin('4')" style="height: 50px; font-size: 20px; font-weight: bold; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 12px; cursor: pointer;">4</button>
        <button type="button" onclick="pressPortalPin('5')" style="height: 50px; font-size: 20px; font-weight: bold; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 12px; cursor: pointer;">5</button>
        <button type="button" onclick="pressPortalPin('6')" style="height: 50px; font-size: 20px; font-weight: bold; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 12px; cursor: pointer;">6</button>
        <button type="button" onclick="pressPortalPin('7')" style="height: 50px; font-size: 20px; font-weight: bold; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 12px; cursor: pointer;">7</button>
        <button type="button" onclick="pressPortalPin('8')" style="height: 50px; font-size: 20px; font-weight: bold; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 12px; cursor: pointer;">8</button>
        <button type="button" onclick="pressPortalPin('9')" style="height: 50px; font-size: 20px; font-weight: bold; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 12px; cursor: pointer;">9</button>
        <button type="button" onclick="clearPortalPin()" style="height: 50px; font-size: 13px; font-weight: bold; background: #334155; color: #cbd5e1; border: none; border-radius: 12px; cursor: pointer;">초기화</button>
        <button type="button" onclick="pressPortalPin('0')" style="height: 50px; font-size: 20px; font-weight: bold; background: #1e293b; color: #f8fafc; border: 1px solid #334155; border-radius: 12px; cursor: pointer;">0</button>
        <button type="button" onclick="backspacePortalPin()" style="height: 50px; font-size: 16px; font-weight: bold; background: #334155; color: #cbd5e1; border: none; border-radius: 12px; cursor: pointer;">⌫</button>
      </div>
    </div>
  </div>

  <script>
    /* =========================================================================
       접속 보안 검증 및 자동 로그인 제어
       ========================================================================= */
    // ★ 비밀번호를 변경할 때 이 버전 숫자(v1 -> v2 -> v3)만 하나 올려주면
    // 기존에 로그인되어 있던 모든 직원 기기들이 자동으로 로그아웃됩니다!
    const AUTH_KEY = 'bgl_auth_v2';
    let currentPortalPin = "";

    const BASE_APP_URL = "https://script.google.com/macros/s/AKfycbx0aNwrGPIT5fb4CJnl2J6I2dZvYHdWVJ7H9NHPX3w15A0fC_h68DcclLMwzYswn2nJ/exec";
    const appFrame = document.getElementById('appFrame');
    const pinScreen = document.getElementById('portalPinScreen');
    const logoutBtn = document.getElementById('portalLogoutBtn');

    // 1. iframe 지연 로딩 함수 (기존 파라미터 및 로컬 저장소 로직 유지)
    function loadMainApp() {
      if (appFrame.src && appFrame.src !== "about:blank") return;

      let savedDutyTeam = '', savedDutyName = '', savedStation = '', savedTtRecords = '';
      try {
        savedDutyTeam = localStorage.getItem('recent_station_team') || localStorage.getItem('station_user_team') || '3';
        savedDutyName = localStorage.getItem('recent_station_name') || localStorage.getItem('station_user_name') || '';
        savedStation = localStorage.getItem('lastTimetableStation') || '대저역';
        savedTtRecords = localStorage.getItem('timetable_picked_records_v1') || '';
      } catch(e) {}

      let currentQuery = window.location.search || "";
      let currentHash = window.location.hash || "";
      let params = new URLSearchParams(currentQuery);

      if (!params.has("initTeam") && savedDutyTeam) params.set("initTeam", savedDutyTeam);
      if (!params.has("initName") && savedDutyName) params.set("initName", savedDutyName);
      if (!params.has("initStation") && savedStation) params.set("initStation", savedStation);
      if (!params.has("initTtRecords") && savedTtRecords) params.set("initTtRecords", savedTtRecords);

      // 팀, 이름, 역, 시각표 파라미터 전달 바로 아래에 추가
      params.set("portalKey", "bgl_verified");

      let finalQuery = params.toString() ? ("?" + params.toString()) : "";
      appFrame.src = BASE_APP_URL + finalQuery + currentHash;
    }

   // 2. 인증 상태 체크
    function checkPortalAuth() {
      let isAuth = false;
      try {
        isAuth = (localStorage.getItem(AUTH_KEY) === 'true');
      } catch(e) {}

      if (isAuth) {
        if (pinScreen) pinScreen.style.display = 'none';
        
        // ★ 바로 켜지 않고, iframe 로딩이 완료되었을 때만 버튼을 노출
        if (logoutBtn) logoutBtn.style.display = 'none';
        appFrame.onload = function() {
          if (logoutBtn) logoutBtn.style.display = 'inline-flex';
        };

        loadMainApp();
      } else {
        if (pinScreen) pinScreen.style.display = 'flex';
        if (logoutBtn) logoutBtn.style.display = 'none';
        clearPortalPin();
      }
    }

    // 3. 인디케이터 UI 갱신
    function updatePortalPinDots() {
      for (let i = 0; i < 4; i++) {
        const dot = document.getElementById('pDot' + i);
        if (!dot) continue;
        if (i < currentPortalPin.length) {
          dot.style.background = '#38bdf8';
          dot.style.borderColor = '#38bdf8';
          dot.style.boxShadow = '0 0 10px rgba(56, 189, 248, 0.7)';
        } else {
          dot.style.background = 'transparent';
          dot.style.borderColor = '#475569';
          dot.style.boxShadow = 'none';
        }
      }
    }

    function pressPortalPin(num) {
      if (currentPortalPin.length >= 4) return;
      currentPortalPin += num;
      updatePortalPinDots();

      if (currentPortalPin.length === 4) {
        setTimeout(verifyPortalPin, 100);
      }
    }

    function backspacePortalPin() {
      if (currentPortalPin.length > 0) {
        currentPortalPin = currentPortalPin.slice(0, -1);
        updatePortalPinDots();
      }
    }

    function clearPortalPin() {
      currentPortalPin = "";
      updatePortalPinDots();
      const msg = document.getElementById('pStatusMsg');
      if (msg) {
        msg.innerText = "4자리 보안 PIN을 입력하세요(힌트:대저)";
        msg.style.color = "#94a3b8";
      }
    }

    // 4. 난독화 PIN 검증 로직
    function verifyPortalPin() {
      const msg = document.getElementById('pStatusMsg');
      const val = currentPortalPin.toString().trim();

      // 보내주신 ASCII 코드 연산 검증 (9607)
      const isValid = (
        val.length === 4 &&
        val.charCodeAt(0) === (50 + 7) &&  
        val.charCodeAt(1) === (60 - 6) &&  
        val.charCodeAt(2) === (40 + 8) &&  
        val.charCodeAt(3) === (50 + 5)    
      );

      if (isValid) {
        if (msg) {
          msg.innerText = "인증 성공! 접속합니다.";
          msg.style.color = "#38bdf8";
        }
        try {
          localStorage.setItem(AUTH_KEY, 'true');
        } catch(e) {}

        setTimeout(function() {
          if (pinScreen) pinScreen.style.display = 'none';
          if (logoutBtn) logoutBtn.style.display = 'inline-flex';
          loadMainApp();
        }, 300);
      } else {
        if (msg) {
          msg.innerText = "PIN 번호가 일치하지 않습니다.";
          msg.style.color = "#ef4444";
        }
        setTimeout(clearPortalPin, 600);
      }
    }

    // 5. 수동 로그아웃
    function handlePortalLogout() {
      if (!confirm("로그아웃하시겠습니까? (자동 로그인이 해제됩니다)")) return;
      try {
        localStorage.removeItem(AUTH_KEY);
      } catch(e) {}
      checkPortalAuth();
    }

    // 6. 기존 메시지 리스너 (시각표/근무표 양방향 통신 유지)
    window.addEventListener("message", function(e) {
      if (!e || !e.data) return;

      if (e.data.type === "PING_PARENT_ENV") {
        const responseData = { type: "PONG_PARENT_ENV" };
        if (e.source) e.source.postMessage(responseData, "*");
        if (appFrame && appFrame.contentWindow) appFrame.contentWindow.postMessage(responseData, "*");
        return;
      }

      if (e.data.type === "SAVE_TIMETABLE_PREF") {
        try {
          if (e.data.station) localStorage.setItem('lastTimetableStation', e.data.station);
          if (e.data.records !== undefined) localStorage.setItem('timetable_picked_records_v1', JSON.stringify(e.data.records));
        } catch(err) {}
      }

      if (e.data.type === "REQ_TIMETABLE_PREF") {
        try {
          const st = localStorage.getItem('lastTimetableStation') || "대저역";
          const rawRec = localStorage.getItem('timetable_picked_records_v1');
          const records = rawRec ? JSON.parse(rawRec) : {};
          if (appFrame && appFrame.contentWindow) {
            appFrame.contentWindow.postMessage({
              type: "SEND_TIMETABLE_PREF",
              station: st,
              records: records
            }, "*");
          }
        } catch(err) {}
      }

      if (e.data.type === "SAVE_USER_PREF" || e.data.type === "SET_RECENT_DUTY_USER") {
        try {
          const t = e.data.team || '3';
          const n = (e.data.name || '').trim();
          if (n) {
            localStorage.setItem('recent_station_team', t);
            localStorage.setItem('recent_station_name', n);
            localStorage.setItem('station_user_team', t);
            localStorage.setItem('station_user_name', n);
          }
        } catch(err) {}
      }

      if (e.data.type === "REQ_DUTY_USER_PREF") {
        try {
          const t = localStorage.getItem('recent_station_team') || localStorage.getItem('station_user_team') || '3';
          const n = localStorage.getItem('recent_station_name') || localStorage.getItem('station_user_name') || '';

          if (n && appFrame && appFrame.contentWindow) {
            appFrame.contentWindow.postMessage({
              type: "SEND_DUTY_USER_PREF",
              team: t,
              name: n
            }, "*");
          }
        } catch(err) {}
      }
    }, false);

    // 실행 시작
    checkPortalAuth();
  </script>
</body>
</html>
