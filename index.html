<script>
  const BASE_URL = "https://script.google.com/macros/s/AKfycbx0aNwrGPIT5fb4CJnl2J6I2dZvYHdWVJ7H9NHPX3w15A0fC_h68DcclLMwzYswn2nJ/exec";
  const appFrame = document.getElementById('appFrame');

  // 1. GitHub 최상위 localStorage 우선 탐색 (Safari ITP 차단 없음)
  let savedTeam = localStorage.getItem('station_user_team') || '';
  let savedName = localStorage.getItem('station_user_name') || '';
  let savedStation = localStorage.getItem('lastTimetableStation') || '';
  let savedTtRecords = localStorage.getItem('timetable_picked_records_v1') || '';

  // URL Query 보조 탐색
  const urlParams = new URLSearchParams(window.location.search);
  if (!savedTeam && urlParams.get('initTeam')) savedTeam = urlParams.get('initTeam');
  if (!savedName && urlParams.get('initName')) savedName = urlParams.get('initName');

  // 2. 초기 로드 시 파라미터를 완성해서 iframe 호출
  let queryParts = [];
  if (savedTeam) queryParts.push("initTeam=" + encodeURIComponent(savedTeam));
  if (savedName) queryParts.push("initName=" + encodeURIComponent(savedName));
  if (savedStation) queryParts.push("initStation=" + encodeURIComponent(savedStation));
  if (savedTtRecords) queryParts.push("initTtRecords=" + encodeURIComponent(savedTtRecords));

  appFrame.src = queryParts.length > 0 ? (BASE_URL + "?" + queryParts.join("&")) : BASE_URL;

  // 3. 내부 웹앱 메시지 처리
  window.addEventListener("message", function(e) {
    if (!e.data) return;

    if (e.data.type === "SAVE_USER_PREF") {
      if (e.data.team) {
        localStorage.setItem('station_user_team', String(e.data.team));
        savedTeam = String(e.data.team);
      }
      if (e.data.name) {
        localStorage.setItem('station_user_name', String(e.data.name));
        savedName = String(e.data.name);
      }
      try {
        const nextUrl = new URL(window.location.href);
        if (savedTeam) nextUrl.searchParams.set('initTeam', savedTeam);
        if (savedName) nextUrl.searchParams.set('initName', savedName);
        window.history.replaceState({}, '', nextUrl.toString());
      } catch(err) {}
    }

    if (e.data.type === "SAVE_TIMETABLE_PREF") {
      if (e.data.station) localStorage.setItem('lastTimetableStation', String(e.data.station));
      if (e.data.records !== undefined) localStorage.setItem('timetable_picked_records_v1', JSON.stringify(e.data.records));
    }

    // 내부에서 재요청 시 값 전송
    if (e.data.type === "REQUEST_USER_PREF") {
      if (appFrame && appFrame.contentWindow && (savedTeam || savedName)) {
        appFrame.contentWindow.postMessage({
          type: "RESTORE_PREF",
          team: savedTeam,
          name: savedName
        }, "*");
      }
    }
  }, false);
</script>
